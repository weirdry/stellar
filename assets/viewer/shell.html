<!doctype html>
<html lang="__LOCALE__">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <title>__TITLE__</title>
    <link rel="icon" type="image/svg+xml" sizes="any" href="__FAVICON__" />
    <style>
      __CSS__
    </style>
  </head>
  <body>
    <header class="topbar">
      <button
        class="icon mobile-only"
        id="tree-toggle"
        title="{{ui.open.tree}}"
        aria-label="{{ui.open.tree}}"
      >
        ☰</button
      ><a class="brand" href="#" id="brand"
        ><span class="brand-mark" aria-hidden="true">__LOGO__</span>
        <div>
          <b id="brand-title">Stellar</b
          ><span id="brand-subtitle">WORK MAP</span>
        </div></a
      >
      <div class="top-divider"></div>
      <span class="snapshot" id="snapshot"></span>
      <div class="top-actions">
        <button class="quiet" id="maps-open">{{ui.references}}</button
        ><button
          class="icon"
          id="theme"
          title="{{ui.theme.light}}"
          aria-label="{{ui.theme.light}}"
        >
          ☀</button
        ><button
          class="icon"
          id="help-open"
          title="{{ui.open.help}}"
          aria-label="{{ui.open.help}}"
        >
          ?</button
        ><button
          class="icon mobile-only"
          id="info-toggle"
          title="{{ui.open.info}}"
          aria-label="{{ui.open.info}}"
        >
          ⓘ
        </button>
      </div>
    </header>
    <div class="workspace">
      <aside class="sidebar" id="sidebar" aria-label="{{ui.aria.tree}}">
        <div class="sidebar-top">
          <div class="section-label">
            {{ui.section.explorer}}
            <button
              class="text-button"
              id="tree-collapse"
              title="{{ui.collapse.all}}"
            >
              {{ui.collapse}}
            </button>
          </div>
          <label class="searchbox"
            ><span>⌕</span
            ><input
              id="search"
              autocomplete="off"
              placeholder="{{ui.search.placeholder}}"
              aria-label="{{ui.search.label}}"
            /><kbd>/</kbd></label
          >
          <div id="search-results" class="search-results" hidden></div>
          <div class="scope-row">
            <select id="scope" aria-label="{{ui.scope.label}}">
              <option value="active">{{ui.scope.active}}</option>
              <option value="all">{{ui.scope.all}}</option>
              <option value="started">{{ui.scope.started}}</option>
              <option value="unstarted">{{ui.scope.unstarted}}</option>
              <option value="backlog">{{ui.scope.backlog}}</option>
              <option value="completed">{{ui.scope.completed}}</option>
              <option value="unknown">{{ui.scope.unknown}}</option>
              <option value="closed">{{ui.scope.closed}}</option></select
            ><span id="scope-count" class="count"></span>
          </div>
        </div>
        <nav class="tree" id="tree" aria-label="{{ui.aria.groups}}"></nav>
        <div class="sidebar-bottom">
          <b id="taxonomy-count"></b>
          <p>{{ui.classification.rule}}</p>
        </div>
      </aside>
      <main class="stage" id="stage">
        <div class="canvas-top">
          <div class="navigation">
            <button
              class="icon"
              id="back"
              aria-label="{{ui.back}}"
              title="{{ui.back}}"
              disabled
            >
              ←</button
            ><button class="crumb-home" id="overview">{{ui.overview}}</button
            ><span id="breadcrumbs"></span>
          </div>
          <div class="target-wrap">
            <span class="target-label">{{ui.target.label}}</span
            ><select id="target" aria-label="{{ui.aria.target}}">
              <option value="">{{ui.target.all}}</option></select
            ><button
              id="target-clear"
              class="text-button"
              hidden
              aria-label="{{ui.target.clear}}"
            >
              ×
            </button>
          </div>
        </div>
        <div class="canvas-caption" id="canvas-caption"></div>
        <svg
          id="graph"
          xmlns="http://www.w3.org/2000/svg"
          role="img"
          aria-label="{{ui.aria.graph}}"
        >
          <defs>
            <marker
              id="arrow-blocks"
              viewBox="0 0 10 10"
              refX="8"
              refY="5"
              markerWidth="7"
              markerHeight="7"
              orient="auto-start-reverse"
            >
              <path
                d="M 0 1 L 9 5 L 0 9"
                fill="none"
                stroke="var(--blocks)"
                stroke-width="1.5"
              />
            </marker>
            <marker
              id="arrow-parent"
              viewBox="0 0 10 10"
              refX="8"
              refY="5"
              markerWidth="6"
              markerHeight="6"
              orient="auto-start-reverse"
            >
              <path
                d="M 0 1 L 9 5 L 0 9"
                fill="none"
                stroke="var(--parent)"
                stroke-width="1.5"
              />
            </marker>
            <marker
              id="arrow-duplicate"
              viewBox="0 0 10 10"
              refX="8"
              refY="5"
              markerWidth="6"
              markerHeight="6"
              orient="auto-start-reverse"
            >
              <path
                d="M 0 1 L 9 5 L 0 9"
                fill="none"
                stroke="var(--muted)"
                stroke-width="1.5"
              />
            </marker>
          </defs>
          <g id="viewport">
            <g id="regions"></g>
            <g id="edges"></g>
            <g id="edge-labels"></g>
            <g id="nodes"></g>
          </g>
        </svg>
        <div class="empty-state" id="empty" hidden>
          <b>{{ui.empty.title}}</b><span>{{ui.empty.hint}}</span>
        </div>
        <div class="canvas-bottom">
          <div class="legend-panel">
            <div class="edge-toggles" aria-label="{{ui.aria.relations}}">
              <label
                ><input
                  type="checkbox"
                  data-edge-toggle="classification"
                  checked
                /><i class="line-sample classification"></i
                >{{ui.edge.classification}}</label
              ><label
                ><input type="checkbox" data-edge-toggle="blocks" checked /><i
                  class="line-sample blocks"
                ></i
                >{{ui.edge.blocks}}</label
              ><label
                ><input type="checkbox" data-edge-toggle="related" checked /><i
                  class="line-sample related"
                ></i
                >{{ui.edge.related}}</label
              ><label
                ><input type="checkbox" data-edge-toggle="parent" checked /><i
                  class="line-sample parent"
                ></i
                >{{ui.edge.parent}}</label
              ><label
                ><input
                  type="checkbox"
                  data-edge-toggle="duplicate"
                  checked
                /><i class="line-sample duplicate"></i
                >{{ui.edge.duplicate}}</label
              >
            </div>
            <div class="status-legend">
              <span><i class="status-dot started"></i>{{ui.scope.started}}</span
              ><span
                ><i class="status-dot unstarted"></i
                >{{ui.scope.unstarted}}</span
              ><span
                ><i class="status-dot backlog"></i>{{ui.scope.backlog}}</span
              ><span
                ><i class="status-dot completed"></i
                >{{ui.scope.completed}}</span
              ><span class="ghost-key">◌ {{ui.context}}</span>
            </div>
          </div>
          <div class="viewport-tools">
            <button
              class="icon"
              id="zoom-out"
              title="{{ui.zoom.out}}"
              aria-label="{{ui.zoom.out}}"
            >
              −</button
            ><span id="zoom-label">100%</span
            ><button
              class="icon"
              id="zoom-in"
              title="{{ui.zoom.in}}"
              aria-label="{{ui.zoom.in}}"
            >
              +</button
            ><span class="tool-divider"></span
            ><button
              class="icon"
              id="fit"
              title="{{ui.fit.key}}"
              aria-label="{{ui.fit}}"
            >
              ⛶</button
            ><button
              class="icon"
              id="export"
              title="{{ui.export}}"
              aria-label="{{ui.export}}"
            >
              ↓
            </button>
          </div>
        </div>
        <div class="minimap-wrap">
          <svg
            id="minimap"
            viewBox="0 0 160 96"
            role="img"
            aria-label="{{ui.aria.minimap}}"
          ></svg>
        </div>
        <div class="gesture-hint">{{ui.gesture}}</div>
        <div id="tooltip" class="graph-tooltip" hidden></div>
        <div id="toast" class="toast" role="status" hidden></div>
      </main>
      <aside
        class="inspector"
        id="inspector"
        aria-label="{{ui.aria.inspector}}"
      ></aside>
    </div>
    <div
      id="modal"
      class="modal"
      role="dialog"
      aria-modal="true"
      aria-label="{{ui.aria.references}}"
      hidden
    >
      <div class="modal-card">
        <header>
          <h2 id="modal-title"></h2>
          <button class="icon" id="modal-close" aria-label="{{ui.close}}">
            ×
          </button>
        </header>
        <div id="modal-content"></div>
      </div>
    </div>
    <script type="application/json" id="data">
      __DATA__
    </script>
    <script type="application/json" id="messages">
      __MESSAGES__
    </script>
    <script>
      __JS__;
    </script>
  </body>
</html>
