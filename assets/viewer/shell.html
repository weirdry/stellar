<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <title>__TITLE__</title>
    <style>
      __CSS__
    </style>
  </head>
  <body>
    <header class="topbar">
      <button
        class="icon mobile-only"
        id="tree-toggle"
        title="트리 열기"
        aria-label="트리 열기"
      >
        ☰</button
      ><a class="brand" href="#" id="brand"
        ><span class="brand-mark">⌘</span>
        <div>
          <b id="brand-title">Stellar</b
          ><span id="brand-subtitle">WORK MAP</span>
        </div></a
      >
      <div class="top-divider"></div>
      <span class="snapshot" id="snapshot"></span>
      <div class="top-actions">
        <button class="quiet" id="maps-open">참고 자료</button
        ><button
          class="icon"
          id="theme"
          title="라이트 모드"
          aria-label="라이트 모드"
        >
          ☀</button
        ><button
          class="icon"
          id="help-open"
          title="사용 안내"
          aria-label="사용 안내"
        >
          ?</button
        ><button
          class="icon mobile-only"
          id="info-toggle"
          title="상세 열기"
          aria-label="상세 열기"
        >
          ⓘ
        </button>
      </div>
    </header>
    <div class="workspace">
      <aside class="sidebar" id="sidebar" aria-label="이슈 트리">
        <div class="sidebar-top">
          <div class="section-label">
            EXPLORER
            <button
              class="text-button"
              id="tree-collapse"
              title="트리 모두 접기"
            >
              접기
            </button>
          </div>
          <label class="searchbox"
            ><span>⌕</span
            ><input
              id="search"
              autocomplete="off"
              placeholder="이슈 ID · 제목 검색"
              aria-label="이슈 검색"
            /><kbd>/</kbd></label
          >
          <div id="search-results" class="search-results" hidden></div>
          <div class="scope-row">
            <select id="scope" aria-label="상태 범위">
              <option value="active">미완료 작업</option>
              <option value="all">전체 이력</option>
              <option value="started">In Progress</option>
              <option value="unstarted">Todo</option>
              <option value="backlog">Backlog</option>
              <option value="completed">Done</option>
              <option value="unknown">미조회</option>
              <option value="closed">Canceled · Duplicate</option></select
            ><span id="scope-count" class="count"></span>
          </div>
        </div>
        <nav class="tree" id="tree" aria-label="작업 영역과 세부 묶음"></nav>
        <div class="sidebar-bottom">
          <b id="taxonomy-count"></b>
          <p>작업 목적별 분류 · 이슈마다 주분류 1개</p>
        </div>
      </aside>
      <main class="stage" id="stage">
        <div class="canvas-top">
          <div class="navigation">
            <button
              class="icon"
              id="back"
              aria-label="이전 탐색"
              title="이전 탐색"
              disabled
            >
              ←</button
            ><button class="crumb-home" id="overview">전체 지도</button
            ><span id="breadcrumbs"></span>
          </div>
          <div class="target-wrap">
            <span class="target-label">대상 강조</span
            ><select id="target" aria-label="영향 대상 강조">
              <option value="">모든 대상</option></select
            ><button
              id="target-clear"
              class="text-button"
              hidden
              aria-label="대상 강조 해제"
            >
              ×
            </button>
          </div>
        </div>
        <div class="canvas-caption" id="canvas-caption"></div>
        <svg
          id="graph"
          xmlns="http://www.w3.org/2000/svg"
          role="img"
          aria-label="작업 분류와 이슈 관계를 탐색하는 그래프"
        >
          <defs>
            <marker
              id="arrow-blocks"
              viewBox="0 0 10 10"
              refX="8"
              refY="5"
              markerWidth="7"
              markerHeight="7"
              orient="auto-start-reverse"
            >
              <path
                d="M 0 1 L 9 5 L 0 9"
                fill="none"
                stroke="var(--blocks)"
                stroke-width="1.5"
              />
            </marker>
            <marker
              id="arrow-parent"
              viewBox="0 0 10 10"
              refX="8"
              refY="5"
              markerWidth="6"
              markerHeight="6"
              orient="auto-start-reverse"
            >
              <path
                d="M 0 1 L 9 5 L 0 9"
                fill="none"
                stroke="var(--parent)"
                stroke-width="1.5"
              />
            </marker>
            <marker
              id="arrow-duplicate"
              viewBox="0 0 10 10"
              refX="8"
              refY="5"
              markerWidth="6"
              markerHeight="6"
              orient="auto-start-reverse"
            >
              <path
                d="M 0 1 L 9 5 L 0 9"
                fill="none"
                stroke="var(--muted)"
                stroke-width="1.5"
              />
            </marker>
          </defs>
          <g id="viewport">
            <g id="regions"></g>
            <g id="edges"></g>
            <g id="edge-labels"></g>
            <g id="nodes"></g>
          </g>
        </svg>
        <div class="empty-state" id="empty" hidden>
          <b>이 상태에 해당하는 이슈가 없습니다</b
          ><span>왼쪽 상태 범위를 바꿔 주세요.</span>
        </div>
        <div class="canvas-bottom">
          <div class="legend-panel">
            <div class="edge-toggles" aria-label="관계 표시">
              <label
                ><input
                  type="checkbox"
                  data-edge-toggle="classification"
                  checked
                /><i class="line-sample classification"></i>분류</label
              ><label
                ><input type="checkbox" data-edge-toggle="blocks" checked /><i
                  class="line-sample blocks"
                ></i
                >선행 →</label
              ><label
                ><input type="checkbox" data-edge-toggle="related" checked /><i
                  class="line-sample related"
                ></i
                >연관</label
              ><label
                ><input type="checkbox" data-edge-toggle="parent" checked /><i
                  class="line-sample parent"
                ></i
                >원본 상하위</label
              ><label
                ><input
                  type="checkbox"
                  data-edge-toggle="duplicate"
                  checked
                /><i class="line-sample parent"></i>중복 →</label
              >
            </div>
            <div class="status-legend">
              <span><i class="status-dot started"></i>In Progress</span
              ><span><i class="status-dot unstarted"></i>Todo</span
              ><span><i class="status-dot backlog"></i>Backlog</span
              ><span><i class="status-dot completed"></i>Done</span
              ><span class="ghost-key">◌ 맥락</span>
            </div>
          </div>
          <div class="viewport-tools">
            <button class="icon" id="zoom-out" title="축소" aria-label="축소">
              −</button
            ><span id="zoom-label">100%</span
            ><button class="icon" id="zoom-in" title="확대" aria-label="확대">
              +</button
            ><span class="tool-divider"></span
            ><button
              class="icon"
              id="fit"
              title="화면에 맞춤 · F"
              aria-label="화면에 맞춤"
            >
              ⛶</button
            ><button
              class="icon"
              id="export"
              title="현재 화면 SVG 저장"
              aria-label="현재 화면 SVG 저장"
            >
              ↓
            </button>
          </div>
        </div>
        <div class="minimap-wrap">
          <svg
            id="minimap"
            viewBox="0 0 160 96"
            role="img"
            aria-label="현재 그래프 미니맵"
          ></svg>
        </div>
        <div class="gesture-hint">드래그로 이동 · 휠로 확대 · F 맞춤</div>
        <div id="tooltip" class="graph-tooltip" hidden></div>
        <div id="toast" class="toast" role="status" hidden></div>
      </main>
      <aside
        class="inspector"
        id="inspector"
        aria-label="선택한 항목 상세"
      ></aside>
    </div>
    <div
      id="modal"
      class="modal"
      role="dialog"
      aria-modal="true"
      aria-label="참고 보기"
      hidden
    >
      <div class="modal-card">
        <header>
          <h2 id="modal-title"></h2>
          <button class="icon" id="modal-close" aria-label="닫기">×</button>
        </header>
        <div id="modal-content"></div>
      </div>
    </div>
    <script type="application/json" id="data">
      __DATA__
    </script>
    <script>
      __JS__;
    </script>
  </body>
</html>
